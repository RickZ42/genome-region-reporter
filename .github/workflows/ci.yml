name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build a wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install the wheel with development dependencies
        run: |
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[dev]'])"
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test the installed package outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests" --cov=regionreport --cov-report=term-missing --basetemp="$RUNNER_TEMP/regionreport-tests"

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and documentation tools
        run: python -m pip install ".[docs]"
      - name: Build API documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
