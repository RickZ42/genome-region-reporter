[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genome-region-reporter"
version = "0.1.0"
description = "Annotate genomic regions with genes and transposable elements."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "bioframe>=0.8,<1",
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1,<2"]
docs = ["sphinx>=7,<10"]

[project.scripts]
regionreport = "regionreport.cli:main"

[project.urls]
Repository = "https://github.com/RickZ42/genome-region-reporter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
